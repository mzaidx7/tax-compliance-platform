name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure test application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run static analysis
        run: composer types:check

      - name: Test application entry and accounts
        id: test-entry
        continue-on-error: true
        run: bash .github/scripts/run-test-group.sh "Application entry and account tests" tests/Feature/DashboardQueuesTest.php tests/Feature/DashboardTest.php tests/Feature/ExampleTest.php tests/Feature/OperationalFoundationTest.php tests/Feature/ReadinessComingSoonTest.php tests/Feature/Auth tests/Feature/Settings

      - name: Test tenancy and platform boundaries
        id: test-boundaries
        continue-on-error: true
        run: bash .github/scripts/run-test-group.sh "Tenancy and platform boundary tests" tests/Feature/Audit tests/Feature/Authorization tests/Feature/Exports tests/Feature/Feature tests/Feature/Livewire tests/Feature/Notifications tests/Feature/Operations tests/Feature/Tenancy

      - name: Test compliance operations
        id: test-compliance
        continue-on-error: true
        run: bash .github/scripts/run-test-group.sh "Compliance operation tests" tests/Feature/Clients tests/Feature/Compliance tests/Feature/Documents tests/Feature/Filings tests/Feature/Generation tests/Feature/Payments tests/Feature/Reports tests/Feature/Rules tests/Feature/Schedule tests/Feature/Taxes

      - name: Test workflows and future readiness foundation
        id: test-workflows
        continue-on-error: true
        run: bash .github/scripts/run-test-group.sh "Workflow and readiness foundation tests" tests/Feature/Readiness tests/Feature/Workflows tests/Unit

      - name: Enforce application entry and account tests
        if: always() && steps.test-entry.outcome != 'success'
        run: exit 1

      - name: Enforce tenancy and platform boundary tests
        if: always() && steps.test-boundaries.outcome != 'success'
        run: exit 1

      - name: Enforce compliance operation tests
        if: always() && steps.test-compliance.outcome != 'success'
        run: exit 1

      - name: Enforce workflow and readiness foundation tests
        if: always() && steps.test-workflows.outcome != 'success'
        run: exit 1

      - name: Build production assets
        run: npm run build

      - name: Audit production dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high --omit=dev
